# GitHub Actions：push 到 main 后自动 SSH 到服务器执行 deploy.sh
name: Deploy

on:
  push:
    branches: [main]        # 推送到 main 分支时触发
  workflow_dispatch:        # 允许在 Actions 页面手动点击运行

# 同一时间只跑一个部署，新的部署会排队等旧的结束
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 到服务器执行部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /www/wwwroot/hello-docker
            bash deploy.sh
